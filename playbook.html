<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoegaze Guitar Explorer</title>
  <style>
    :root {
      --bg: #0b0c14;
      --card-bg: #141726;
      --card-border: #232840;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --accent-secondary: #06b6d4;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --fretboard-wood: #1e1b18;
      --fret-wire: #64748b;
      --marker-dot: #ec4899;
      --open-string: #10b981;
      --muted-string: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }
    header h1 {
      font-size: 2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a78bfa, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    select, input[type="range"], button {
      background: #1e2238;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    select:hover, button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: var(--accent);
      border: none;
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    button.primary:hover {
      background: #7c3aed;
    }
    button.active {
      background: #059669;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }

    /* Fretboard View */
    .fretboard-wrap {
      overflow-x: auto;
      padding: 12px 0;
    }
    .fretboard {
      position: relative;
      width: 900px;
      height: 190px;
      background: var(--fretboard-wood);
      border-radius: 6px;
      border-top: 3px solid #332d27;
      border-bottom: 3px solid #332d27;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      user-select: none;
      margin: 0 auto;
    }

    /* Nut */
    .nut {
      position: absolute;
      left: 48px;
      top: 0;
      bottom: 0;
      width: 10px;
      background: #e2e8f0;
      box-shadow: 2px 0 6px rgba(0,0,0,0.6);
      z-index: 3;
    }

    /* Frets */
    .fret-wire {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(90deg, #94a3b8, #475569);
      z-index: 2;
    }
    .fret-num {
      position: absolute;
      bottom: -22px;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Fret Inlays */
    .fret-marker {
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Strings */
    .string-line {
      position: absolute;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #cbd5e1, #64748b);
      z-index: 4;
      pointer-events: none;
    }

    /* String Header Status */
    .string-status {
      position: absolute;
      left: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 700;
      transform: translateY(-50%);
      z-index: 5;
    }
    .string-status.open { color: var(--open-string); }
    .string-status.mute { color: var(--muted-string); }

    /* Note Marker on Fretboard */
    .fret-note {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--marker-dot);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: white;
      z-index: 6;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fret-note.ringing {
      transform: translate(-50%, -50%) scale(1.3);
      background: #38bdf8;
      box-shadow: 0 0 16px #38bdf8;
    }

    /* Chord Details Bar */
    .chord-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }
    .chord-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .chord-tab {
      font-family: monospace;
      letter-spacing: 2px;
      background: #0f121e;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--card-border);
    }
    .chord-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Quick Chord Selector Pills */
    .chord-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .chord-btn {
      padding: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .chord-btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    /* Progressions Bar */
    .progression-steps {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .prog-step {
      flex: 1;
      min-width: 105px;
      padding: 10px;
      border-radius: 8px;
      background: #111424;
      border: 1px solid var(--card-border);
      text-align: center;
      font-size: 0.85rem;
      user-select: none;
      transition: all 0.2s;
    }
    .prog-step:hover {
      border-color: var(--accent);
    }
    .prog-step.active {
      border-color: #ec4899;
      background: rgba(236, 72, 153, 0.15);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <h1>Shoegaze Guitar Lab</h1>
    <p>Interactive Fretboard & Playbook Progression Player</p>
  </header>

  <div class="container">
    <!-- Controls -->
    <div class="card controls">
      <div class="control-group">
        <label for="book-section">Phase / Module</label>
        <select id="book-section">
          <option value="phase1_slide">Phase I: Moveable C-Shape (Step 1-2)</option>
          <option value="phase1_twofinger">Phase I: 2-Finger MBV Dyads (Step 5)</option>
          <option value="phase2_chordscale">Phase II: Key of E Chord-Scale (Step 3)</option>
          <option value="phase3_modal">Phase III: Borrowed Modal Progression</option>
        </select>
      </div>

      <div class="control-group">
        <label for="tempo-range">Tempo: <span id="bpm-val">100</span> BPM</label>
        <input type="range" id="tempo-range" min="60" max="150" value="100" />
      </div>

      <div class="control-group">
        <button id="strum-btn" class="primary">Strum Chord (Space)</button>
        <button id="play-prog-btn">Play Progression</button>
      </div>
    </div>

    <!-- Active Chord & Fretboard Visualizer -->
    <div class="card">
      <div class="chord-info">
        <div>
          <div class="chord-title" id="display-name">C Major</div>
          <div class="chord-desc" id="display-desc">Standard open shape foundation. Move up neck while keeping open G ringing.</div>
        </div>
        <div class="chord-tab" id="display-tab">x 3 2 0 1 0</div>
      </div>

      <div class="fretboard-wrap">
        <div class="fretboard" id="fretboard">
          <div class="nut"></div>
        </div>
      </div>
    </div>

    <!-- Current Module Chords -->
    <div class="card">
      <label>Voicings in this Phase</label>
      <div class="chord-grid" id="chord-buttons"></div>
      
      <div style="margin-top: 18px;">
        <label>Rhythm & Progression Tracker</label>
        <div class="progression-steps" id="prog-steps"></div>
      </div>
    </div>
  </div>

  <script>
    /* Audio Synthesizer (Web Audio API with Shoegaze reverb & chorus) */
    class ShoegazeAudio {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.reverb = null;
      }

      init() {
        if (this.ctx) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        
        this.master = this.ctx.createGain();
        this.master.gain.setValueAtTime(0.6, this.ctx.currentTime);

        const length = this.ctx.sampleRate * 2.2;
        const impulse = this.ctx.createBuffer(2, length, this.ctx.sampleRate);
        for (let i = 0; i < 2; i++) {
          const ch = impulse.getChannelData(i);
          for (let j = 0; j < length; j++) {
            ch[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 2.5);
          }
        }
        this.reverb = this.ctx.createConvolver();
        this.reverb.buffer = impulse;

        const revGain = this.ctx.createGain();
        revGain.gain.setValueAtTime(0.4, this.ctx.currentTime);

        this.master.connect(this.ctx.destination);
        this.master.connect(this.reverb);
        this.reverb.connect(revGain);
        revGain.connect(this.ctx.destination);
      }

      playNote(freq, delay = 0) {
        if (!this.ctx) this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const time = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, time);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2200, time);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.exponentialRampToValueAtTime(0.18, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 2.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);

        osc.start(time);
        osc.stop(time + 2.3);
      }

      strumChord(frets, direction = 'down') {
        const standardTunings = [82.41, 110.0, 146.83, 196.0, 246.94, 329.63]; // E A D G B E
        const notesToPlay = [];

        frets.forEach((fret, stringIdx) => {
          if (fret !== -1) {
            const freq = standardTunings[stringIdx] * Math.pow(2, fret / 12);
            notesToPlay.push({ string: stringIdx, fret, freq });
          }
        });

        if (direction === 'up') notesToPlay.reverse();

        notesToPlay.forEach((note, i) => {
          const delay = i * 0.038;
          this.playNote(note.freq, delay);
          setTimeout(() => highlightString(note.string), delay * 1000);
        });
      }
    }

    const audio = new ShoegazeAudio();

    const PLAYBOOK_DATA = {
      phase1_slide: {
        title: "Phase I: Moveable C-Shape",
        progression: ["C", "Dadd11", "G(no5)", "Dadd11", "C"],
        chords: [
          { name: "C", frets: [-1, 3, 2, 0, 1, 0], desc: "Standard open C position. Keep open G ringing." },
          { name: "Dadd11", frets: [-1, 5, 4, 0, 3, 0], desc: "Slide open C up 2 frets. Adds signature shoegaze edge." },
          { name: "G(no5)", frets: [-1, 10, 9, 0, 8, 0], desc: "Slide C-shape up to 10th fret. High harmonic resonance." },
          { name: "C/G", frets: [3, 3, 2, 0, 1, 0], desc: "Thick variation: ring finger on low E (3rd fret)." },
          { name: "Dadd11/A", frets: [5, 5, 4, 0, 3, 0], desc: "Beefier Dadd11 with bass note fretted on low E." }
        ]
      },
      phase1_twofinger: {
        title: "Phase I: 2-Finger MBV Dyads",
        progression: ["D/F#", "G", "Bm", "Amadd11", "D/F#"],
        chords: [
          { name: "D/F#", frets: [2, -1, 0, 2, -1, -1], desc: "2 fingers only. Rub index over A string to cancel it." },
          { name: "G", frets: [3, -1, 0, 4, -1, -1], desc: "Slide shape up 1 fret. Ringing open D string." },
          { name: "Amadd11", frets: [5, -1, 0, 5, -1, -1], desc: "5th fret indie voicing." },
          { name: "Bm", frets: [7, -1, 0, 7, -1, -1], desc: "7th fret minor anchor for darker moods." },
          { name: "D", frets: [10, -1, 0, 11, -1, -1], desc: "10th fret D resolution." },
          { name: "Em7", frets: [12, -1, 0, 12, -1, -1], desc: "12th fret octave dyad." }
        ]
      },
      phase2_chordscale: {
        title: "Phase II: Key of E Chord Scale",
        progression: ["Emaj7", "F#m11", "Eadd9/G#", "Amaj9", "B7sus4", "Emaj7"],
        chords: [
          { name: "Emaj7", frets: [0, 2, 1, 1, 0, 0], desc: "The home sun chord. Let B and High E ring out freely." },
          { name: "F#m11", frets: [2, -1, 2, 2, 0, 0], desc: "Minor 11th color chord." },
          { name: "Eadd9/G#", frets: [4, -1, 4, 4, 0, 0], desc: "Slash bass inversion going up the scale." },
          { name: "Amaj9", frets: [5, -1, 6, 6, 0, 0], desc: "Lush IV-chord major 9th." },
          { name: "B7sus4", frets: [7, -1, 7, 8, 0, 0], desc: "Dominant drone chord." }
        ]
      },
      phase3_modal: {
        title: "Phase III: Borrowed Chords (Major to Minor)",
        progression: ["C", "Cm", "F", "Fm", "C"],
        chords: [
          { name: "C", frets: [-1, 3, 5, 5, 5, 3], desc: "Standard Major barre chord." },
          { name: "Cm", frets: [-1, 3, 5, 5, 4, 3], desc: "Parallel minor borrowed from C minor." },
          { name: "F", frets: [1, 3, 3, 2, 1, 1], desc: "Major IV chord." },
          { name: "Fm", frets: [1, 3, 3, 1, 1, 1], desc: "Minor iv chord for signature shoegaze sadness." },
          { name: "Bb7", frets: [6, 8, 6, 7, 6, 6], desc: "Borrowed bVII dominant chord from C minor." }
        ]
      }
    };

    let currentSection = 'phase1_slide';
    let currentChord = PLAYBOOK_DATA[currentSection].chords[0];
    let isPlaying = false;
    let playInterval = null;
    let currentStepIdx = 0;

    const fretboardEl = document.getElementById('fretboard');
    const TOTAL_FRETS = 14;

    function buildFretboard() {
      const singleDots = [3, 5, 7, 9];
      const fretStep = (900 - 48) / TOTAL_FRETS;

      for (let i = 1; i <= TOTAL_FRETS; i++) {
        const xPos = 48 + i * fretStep;
        
        const wire = document.createElement('div');
        wire.className = 'fret-wire';
        wire.style.left = `${xPos}px`;
        fretboardEl.appendChild(wire);

        const num = document.createElement('div');
        num.className = 'fret-num';
        num.style.left = `${xPos - fretStep / 2}px`;
        num.innerText = i;
        fretboardEl.appendChild(num);

        if (singleDots.includes(i)) {
          const marker = document.createElement('div');
          marker.className = 'fret-marker';
          marker.style.left = `${xPos - fretStep / 2}px`;
          fretboardEl.appendChild(marker);
        } else if (i === 12) {
          const m1 = document.createElement('div');
          m1.className = 'fret-marker';
          m1.style.top = '28%';
          m1.style.left = `${xPos - fretStep / 2}px`;
          const m2 = document.createElement('div');
          m2.className = 'fret-marker';
          m2.style.top = '72%';
          m2.style.left = `${xPos - fretStep / 2}px`;
          fretboardEl.appendChild(m1);
          fretboardEl.appendChild(m2);
        }
      }

      const stringSpacing = 190 / 7;
      for (let s = 0; s < 6; s++) {
        const yPos = (s + 1) * stringSpacing;
        const strLine = document.createElement('div');
        strLine.className = 'string-line';
        strLine.style.top = `${yPos}px`;
        strLine.style.height = `${1 + (5 - s) * 0.5}px`;
        fretboardEl.appendChild(strLine);

        const status = document.createElement('div');
        status.className = 'string-status';
        status.id = `str-status-${s}`;
        status.style.top = `${yPos}px`;
        fretboardEl.appendChild(status);
      }
    }

    function renderChord(chord) {
      currentChord = chord;
      document.getElementById('display-name').innerText = chord.name;
      document.getElementById('display-desc').innerText = chord.desc;
      
      const tabStr = chord.frets.map(f => f === -1 ? 'X' : f).join(' ');
      document.getElementById('display-tab').innerText = tabStr;

      document.querySelectorAll('.fret-note').forEach(el => el.remove());

      const fretStep = (900 - 48) / TOTAL_FRETS;
      const stringSpacing = 190 / 7;

      chord.frets.forEach((fret, sIdx) => {
        const statusEl = document.getElementById(`str-status-${sIdx}`);
        const yPos = (sIdx + 1) * stringSpacing;

        if (fret === -1) {
          statusEl.innerText = '✕';
          statusEl.className = 'string-status mute';
        } else if (fret === 0) {
          statusEl.innerText = '○';
          statusEl.className = 'string-status open';
        } else {
          statusEl.innerText = '';
          statusEl.className = 'string-status';

          const note = document.createElement('div');
          note.className = 'fret-note';
          note.id = `note-${sIdx}`;
          const xPos = 48 + fret * fretStep - fretStep / 2;
          note.style.left = `${xPos}px`;
          note.style.top = `${yPos}px`;
          note.innerText = fret;
          fretboardEl.appendChild(note);
        }
      });

      document.querySelectorAll('.chord-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.name === chord.name);
      });
    }

    function highlightString(sIdx) {
      const note = document.getElementById(`note-${sIdx}`);
      if (note) {
        note.classList.add('ringing');
        setTimeout(() => note.classList.remove('ringing'), 400);
      }
    }

    function triggerProgStep(idx) {
      currentStepIdx = idx;
      const section = PLAYBOOK_DATA[currentSection];
      document.querySelectorAll('.prog-step').forEach(s => s.classList.remove('active'));
      
      const stepEl = document.getElementById(`step-${idx}`);
      if (stepEl) stepEl.classList.add('active');

      const chordName = section.progression[idx];
      const found = section.chords.find(c => c.name === chordName);
      if (found) {
        renderChord(found);
        audio.strumChord(found.frets);
      }
    }

    function loadSection(sectionKey) {
      currentSection = sectionKey;
      const section = PLAYBOOK_DATA[sectionKey];

      // Build Chord Grid
      const grid = document.getElementById('chord-buttons');
      grid.innerHTML = '';
      section.chords.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'chord-btn';
        btn.dataset.name = c.name;
        btn.innerText = c.name;
        btn.onclick = () => {
          renderChord(c);
          audio.strumChord(c.frets);
        };
        grid.appendChild(btn);
      });

      // Build Progression Steps (Clickable with Down/Up strumming cues)
      const progSteps = document.getElementById('prog-steps');
      progSteps.innerHTML = '';
      section.progression.forEach((cName, idx) => {
        const step = document.createElement('div');
        step.className = 'prog-step';
        step.id = `step-${idx}`;
        step.style.cursor = 'pointer';
        step.innerHTML = `<strong>${idx + 1}. ${cName}</strong><div style="font-size:0.75rem; color:#94a3b8; margin-top:4px;">↓ ↑ ↓ ↑</div>`;
        step.title = `Click to play measure ${idx + 1}: ${cName}`;
        
        step.onclick = () => {
          if (isPlaying) {
            playProgBtn.click();
          }
          triggerProgStep(idx);
        };

        progSteps.appendChild(step);
      });

      renderChord(section.chords[0]);
    }

    /* Strum & Progression Controls */
    document.getElementById('strum-btn').onclick = () => {
      audio.strumChord(currentChord.frets);
    };

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        audio.strumChord(currentChord.frets);
      }
    });

    const playProgBtn = document.getElementById('play-prog-btn');
    playProgBtn.onclick = () => {
      if (isPlaying) {
        clearInterval(playInterval);
        isPlaying = false;
        playProgBtn.innerText = 'Play Progression';
        playProgBtn.classList.remove('active');
        document.querySelectorAll('.prog-step').forEach(s => s.classList.remove('active'));
      } else {
        isPlaying = true;
        playProgBtn.innerText = 'Stop';
        playProgBtn.classList.add('active');

        const section = PLAYBOOK_DATA[currentSection];
        currentStepIdx = 0;
        const bpm = parseInt(document.getElementById('tempo-range').value);
        const intervalMs = (60000 / bpm) * 2; // 2 beats per chord step

        triggerProgStep(currentStepIdx);
        playInterval = setInterval(() => {
          currentStepIdx = (currentStepIdx + 1) % section.progression.length;
          triggerProgStep(currentStepIdx);
        }, intervalMs);
      }
    };

    const tempoSlider = document.getElementById('tempo-range');
    tempoSlider.oninput = (e) => {
      document.getElementById('bpm-val').innerText = e.target.value;
      if (isPlaying) {
        playProgBtn.click();
        playProgBtn.click();
      }
    };

    document.getElementById('book-section').onchange = (e) => {
      if (isPlaying) playProgBtn.click();
      loadSection(e.target.value);
    };

    buildFretboard();
    loadSection('phase1_slide');
  </script>
</body>
</html>
