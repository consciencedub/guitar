<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Your Fretboard - Interactive Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fretboard-bg {
            background: linear-gradient(90deg, #4b2e1e 0%, #3e2723 50%, #4b2e1e 100%);
        }
        /* Custom toggle switch styling */
        .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-6xl mx-auto px-4 py-12">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 sm:text-5xl mb-4">Learn Your Fretboard</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                Master the natural notes, visualize octave shapes, and test your recall across the first 12 frets. 
                Based on your daily practice plan.
            </p>
            <div class="mt-6">
                <a href="index.html" class="text-blue-600 hover:text-blue-800 font-semibold flex items-center justify-center gap-2">
                    &larr; Back to Practice Resources
                </a>
            </div>
        </header>

        <!-- Control Panel -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
            
            <!-- Toggles -->
            <div class="flex flex-col sm:flex-row gap-6">
                <!-- Show Natural Notes Toggle -->
                <div class="flex items-center gap-3">
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggleNotes" id="toggleNotes" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-gray-300 z-10 top-0 left-0"/>
                        <label for="toggleNotes" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                    <label for="toggleNotes" class="font-semibold text-gray-700 cursor-pointer select-none">Show Natural Notes</label>
                </div>

                <!-- Quiz Mode Toggle -->
                <div class="flex items-center gap-3">
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggleQuiz" id="toggleQuiz" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-gray-300 z-10 top-0 left-0"/>
                        <label for="toggleQuiz" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer transition-colors duration-200 ease-in-out"></label>
                    </div>
                    <label for="toggleQuiz" class="font-semibold text-gray-700 cursor-pointer select-none">Quiz Mode</label>
                </div>
            </div>

            <!-- Quiz Status Panel -->
            <div id="quiz-panel" class="hidden flex-1 bg-gray-50 rounded-xl p-4 border border-gray-200 text-center flex flex-col justify-center min-w-[250px]">
                <p id="quiz-prompt" class="text-lg font-bold text-gray-800">Activate Quiz Mode to start!</p>
                <p id="quiz-feedback" class="text-sm font-semibold mt-1 h-5 text-transparent">.</p>
            </div>
        </div>

        <!-- Fretboard Container -->
        <div class="overflow-x-auto bg-white p-4 sm:p-8 rounded-2xl shadow-lg border border-gray-200">
            <!-- The Fretboard -->
            <div class="relative w-full fretboard-bg rounded-md min-w-[800px] border-4 border-[#3e2723] shadow-inner select-none">
                
                <!-- Fret numbers above -->
                <div class="absolute -top-7 left-0 right-0 flex text-xs font-bold text-gray-500">
                    <div class="w-12 text-center">0</div>
                    <div class="flex-1 text-center">1</div>
                    <div class="flex-1 text-center">2</div>
                    <div class="flex-1 text-center">3</div>
                    <div class="flex-1 text-center">4</div>
                    <div class="flex-1 text-center">5</div>
                    <div class="flex-1 text-center">6</div>
                    <div class="flex-1 text-center">7</div>
                    <div class="flex-1 text-center">8</div>
                    <div class="flex-1 text-center">9</div>
                    <div class="flex-1 text-center">10</div>
                    <div class="flex-1 text-center">11</div>
                    <div class="flex-1 text-center">12</div>
                </div>

                <!-- Background Layers: Frets and Inlays -->
                <div class="absolute inset-0 flex pointer-events-none z-0">
                    <!-- Nut -->
                    <div class="w-12 border-r-8 border-gray-300 bg-gray-800 bg-opacity-20"></div> 
                    <!-- Frets 1 to 12 -->
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"><div class="w-5 h-5 rounded-full bg-white opacity-40"></div></div> <!-- 3rd fret -->
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"><div class="w-5 h-5 rounded-full bg-white opacity-40"></div></div> <!-- 5th fret -->
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"><div class="w-5 h-5 rounded-full bg-white opacity-40"></div></div> <!-- 7th fret -->
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"><div class="w-5 h-5 rounded-full bg-white opacity-40"></div></div> <!-- 9th fret -->
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex items-center justify-center"></div>
                    <div class="flex-1 border-r-2 border-gray-400 flex flex-col gap-6 items-center justify-center"> <!-- 12th fret -->
                        <div class="w-5 h-5 rounded-full bg-white opacity-40"></div>
                        <div class="w-5 h-5 rounded-full bg-white opacity-40"></div>
                    </div>
                </div>

                <!-- Clickable Strings Layer -->
                <div id="strings-container" class="relative z-10 flex flex-col justify-between py-2 gap-y-1">
                    <!-- JavaScript will populate the strings and frets here -->
                </div>
            </div>
            
            <!-- Tuning labels (Left side) -->
            <div id="tuning-labels" class="hidden md:flex flex-col justify-between absolute left-0 top-0 bottom-0 py-2 gap-y-1 text-sm font-bold text-gray-500 transform -translate-x-full pr-4">
                <!-- Populated by JS -->
            </div>
        </div>

    </div>

    <script>
        // Constants & Data
        const standardTuning = ['E', 'B', 'G', 'D', 'A', 'E']; // 1st string (High E) to 6th string (Low E)
        const stringNames = ['High E (1st)', 'B (2nd)', 'G (3rd)', 'D (4th)', 'A (5th)', 'Low E (6th)'];
        const chromaticScale = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const fretsCount = 12;

        // State
        let isShowNotesActive = false;
        let isQuizActive = false;
        let quizTargetNote = null;
        let quizTargetStringIndex = null;
        
        // DOM Elements
        const stringsContainer = document.getElementById('strings-container');
        const toggleNotesBtn = document.getElementById('toggleNotes');
        const toggleQuizBtn = document.getElementById('toggleQuiz');
        const quizPanel = document.getElementById('quiz-panel');
        const quizPrompt = document.getElementById('quiz-prompt');
        const quizFeedback = document.getElementById('quiz-feedback');

        // Initialization
        function initFretboard() {
            stringsContainer.innerHTML = '';
            
            standardTuning.forEach((openNote, stringIdx) => {
                const stringDiv = document.createElement('div');
                stringDiv.className = 'flex relative group items-center';
                
                // Visual string line
                const lineThickness = [1.5, 2, 2.5, 3.5, 4.5, 5.5][stringIdx]; 
                const line = document.createElement('div');
                line.className = 'absolute left-0 right-0 bg-gradient-to-b from-gray-300 to-gray-400 pointer-events-none drop-shadow-sm';
                line.style.height = `${lineThickness}px`;
                stringDiv.appendChild(line);

                // Create frets for this string
                for (let fret = 0; fret <= fretsCount; fret++) {
                    const noteIndex = (chromaticScale.indexOf(openNote) + fret) % 12;
                    const note = chromaticScale[noteIndex];
                    const isNatural = !note.includes('#');
                    
                    const fretCell = document.createElement('div');
                    // Style: 0 fret is a bit wider visually acting as the open string area
                    fretCell.className = `fret-cell cursor-pointer flex items-center justify-center h-12 ${fret === 0 ? 'w-12 bg-black bg-opacity-20' : 'flex-1'} hover:bg-white hover:bg-opacity-25 transition-all z-20`;
                    
                    fretCell.dataset.note = note;
                    fretCell.dataset.fret = fret;
                    fretCell.dataset.string = stringIdx;
                    fretCell.dataset.isNatural = isNatural;

                    // Note Indicator Bubble
                    const noteLabel = document.createElement('div');
                    noteLabel.className = `note-label opacity-0 w-8 h-8 flex items-center justify-center rounded-full text-white text-sm font-extrabold pointer-events-none shadow-md transform scale-50 transition-all duration-200 ease-out`;
                    
                    if (isNatural) {
                        noteLabel.classList.add('bg-blue-600', 'ring-2', 'ring-white');
                        noteLabel.dataset.natural = "true";
                    } else {
                        noteLabel.classList.add('bg-gray-800');
                    }
                    
                    noteLabel.innerText = note;
                    fretCell.appendChild(noteLabel);
                    
                    // Click handler
                    fretCell.addEventListener('click', () => handleFretClick(fretCell, stringIdx, note, fret));
                    
                    stringDiv.appendChild(fretCell);
                }
                stringsContainer.appendChild(stringDiv);
            });
        }

        // Interaction Handlers
        function handleFretClick(cell, stringIdx, note, fret) {
            // Flash effect
            const label = cell.querySelector('.note-label');
            
            if (isQuizActive) {
                checkQuizAnswer(stringIdx, note, label);
            } else {
                // Free play mode: Just show the note temporarily if 'Show Notes' is off
                if (!isShowNotesActive || !label.dataset.natural) {
                    showTemporarily(label);
                }
            }
        }

        function showTemporarily(label) {
            label.classList.remove('opacity-0', 'scale-50');
            label.classList.add('opacity-100', 'scale-100');
            setTimeout(() => {
                // Check state again in case user toggled switches during timeout
                if (!isShowNotesActive || label.dataset.natural !== "true") {
                    label.classList.add('opacity-0', 'scale-50');
                    label.classList.remove('opacity-100', 'scale-100');
                }
            }, 1000);
        }

        function updateNoteVisibility() {
            const allLabels = document.querySelectorAll('.note-label');
            allLabels.forEach(label => {
                if (isShowNotesActive && label.dataset.natural === "true") {
                    label.classList.remove('opacity-0', 'scale-50');
                    label.classList.add('opacity-100', 'scale-100');
                } else {
                    label.classList.add('opacity-0', 'scale-50');
                    label.classList.remove('opacity-100', 'scale-100');
                }
            });
        }

        // Quiz Logic
        function generateQuizQuestion() {
            // Pick random string (0-5)
            quizTargetStringIndex = Math.floor(Math.random() * 6);
            
            // Find all natural notes on this string up to fret 12
            const availableNotes = [];
            const openNote = standardTuning[quizTargetStringIndex];
            
            for (let fret = 0; fret <= fretsCount; fret++) {
                const noteIndex = (chromaticScale.indexOf(openNote) + fret) % 12;
                const note = chromaticScale[noteIndex];
                if (!note.includes('#')) {
                    availableNotes.push(note);
                }
            }
            
            // Pick random natural note
            // Ensure we remove duplicates (e.g. open string and 12th fret are the same note)
            const uniqueNotes = [...new Set(availableNotes)];
            quizTargetNote = uniqueNotes[Math.floor(Math.random() * uniqueNotes.length)];
            
            quizPrompt.innerHTML = `Find <span class="text-blue-600 font-extrabold text-xl">${quizTargetNote}</span> on the <span class="font-extrabold">${stringNames[quizTargetStringIndex]}</span> string`;
            quizFeedback.innerText = "Waiting for your answer...";
            quizFeedback.className = "text-sm font-semibold mt-1 text-gray-500";
        }

        function checkQuizAnswer(clickedStringIdx, clickedNote, labelDiv) {
            if (clickedStringIdx === quizTargetStringIndex && clickedNote === quizTargetNote) {
                // Correct!
                quizFeedback.innerText = "Correct! Great job.";
                quizFeedback.className = "text-sm font-bold mt-1 text-green-600";
                
                labelDiv.classList.remove('opacity-0', 'scale-50');
                labelDiv.classList.add('opacity-100', 'scale-100', 'bg-green-500');
                
                setTimeout(() => {
                    labelDiv.classList.remove('bg-green-500');
                    if (!isShowNotesActive) {
                        labelDiv.classList.add('opacity-0', 'scale-50');
                        labelDiv.classList.remove('opacity-100', 'scale-100');
                    }
                    generateQuizQuestion();
                }, 1000);

            } else {
                // Incorrect
                quizFeedback.innerText = `Oops! That was ${clickedNote}. Try again.`;
                quizFeedback.className = "text-sm font-bold mt-1 text-red-500";
                
                labelDiv.classList.remove('opacity-0', 'scale-50');
                labelDiv.classList.add('opacity-100', 'scale-100', 'bg-red-500');
                
                setTimeout(() => {
                    labelDiv.classList.remove('bg-red-500');
                    if (!isShowNotesActive || labelDiv.dataset.natural !== "true") {
                        labelDiv.classList.add('opacity-0', 'scale-50');
                        labelDiv.classList.remove('opacity-100', 'scale-100');
                    }
                }, 800);
            }
        }

        // Event Listeners
        toggleNotesBtn.addEventListener('change', (e) => {
            isShowNotesActive = e.target.checked;
            updateNoteVisibility();
        });

        toggleQuizBtn.addEventListener('change', (e) => {
            isQuizActive = e.target.checked;
            if (isQuizActive) {
                quizPanel.classList.remove('hidden');
                // Force hide notes if quiz is active to prevent cheating
                isShowNotesActive = false;
                toggleNotesBtn.checked = false;
                toggleNotesBtn.disabled = true;
                updateNoteVisibility();
                generateQuizQuestion();
            } else {
                quizPanel.classList.add('hidden');
                toggleNotesBtn.disabled = false;
            }
        });

        // Run
        window.onload = () => {
            initFretboard();
        };

    </script>
</body>
</html>
